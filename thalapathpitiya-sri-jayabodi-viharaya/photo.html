<!-- PHOTO LOADER (kept ONLY here) -->
<script>
let gallery = document.getElementById("photo-gallery");
let i = 1;

function loadNextImage(){
    let img = new Image();
    img.src = i + ".webp";

    img.onload = function(){
        img.className = "main-image";
        gallery.appendChild(img);
        i++;
        loadNextImage();
    };
}

loadNextImage();
</script>
